<!doctype html><html lang="fa" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Grammar Path</title><style>
:root{--bg:#0d1320;--card:#151d2b;--card2:#1a2435;--text:#f5f7fb;--muted:#aab4c6;--line:#2a3850;--accent:#7c6cff;--soft:#202b43;--ok:#50d890;--bad:#ff7b83;--warn:#ffbd59;--shadow:0 18px 50px rgba(0,0,0,.22)}
[data-theme="light"]{--bg:#f3f5fa;--card:#fff;--card2:#f8faff;--text:#172033;--muted:#667085;--line:#dfe5ef;--accent:#4f46e5;--soft:#eef2ff;--ok:#067647;--bad:#b42318;--warn:#b54708;--shadow:0 12px 32px rgba(16,24,40,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 85% 0,color-mix(in srgb,var(--accent) 12%,transparent),transparent 28%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.85}
button,input{font:inherit}.wrap{max-width:1080px;margin:auto;padding:16px 16px 110px}.hero,.lesson,.panel,.ref-card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hero{padding:24px;margin-bottom:14px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:color-mix(in srgb,var(--accent) 18%,transparent);left:-80px;top:-120px}.hero>*{position:relative;z-index:1}
.eyebrow{color:var(--accent);font-weight:800;font-size:12px}.hero h1{margin:2px 0 7px;font-size:clamp(28px,5vw,44px)}.hero p{margin:0;color:var(--muted)}
.progress-wrap{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:16px}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#20c997);transition:.3s}
.controls{display:grid;gap:8px;margin:12px 0}.controls-top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.controls-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,.btn{border:0;border-radius:13px;padding:10px 14px;background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;text-align:center}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}button:disabled{opacity:.55}
#prev{grid-column:1}#next{grid-column:2}.lesson{display:none;padding:20px;margin:12px 0}.lesson.active{display:block}
.section-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:16px}.section-head h2{margin:1px 0;font-size:clamp(22px,3.4vw,32px);line-height:1.35}.section-status{font-size:12px;border:1px solid var(--line);padding:4px 9px;border-radius:99px;color:var(--muted)}
.rule,.callout,.note,.notice{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}.grid,.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sentence,.example,.ex{direction:ltr;text-align:left;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:15px;padding:10px 12px;background:var(--bg);margin:8px 0}.sentence .txt{flex:1}.spk,.speak{min-width:42px;width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center}
.exercise,.quiz-q,.q{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;background:var(--card2)}.answer-row{display:flex;gap:8px;flex-wrap:wrap}.answer-row input,.exercise input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px}.feedback{margin-top:8px;padding:9px;border-radius:10px}.feedback.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.feedback.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.options,.choices{display:grid;gap:8px;margin-top:9px}.option,.choice,.listen-choice{background:var(--bg);color:var(--text);border:1px solid var(--line);text-align:left;direction:ltr}.option.correct,.listen-choice.correct{outline:2px solid var(--ok)}.option.wrong,.listen-choice.wrong{outline:2px solid var(--bad)}
.floater{position:fixed;right:14px;bottom:14px;z-index:900}.floater-panel{width:min(340px,calc(100vw - 28px));max-height:66vh;overflow:auto;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 18px 48px rgba(0,0,0,.28);display:none}.floater-panel.show{display:grid;gap:6px}.floater-panel button{text-align:right;background:var(--soft);color:var(--text);border:1px solid var(--line)}.floater-panel button.active{background:var(--accent);color:#fff}.floater-toggle{box-shadow:0 12px 32px rgba(0,0,0,.28)}
.story-top{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.story-visual{min-height:340px;border-radius:22px;overflow:hidden;position:relative;border:1px solid var(--line);background:#0b1020}.story-visual img{width:100%;height:100%;min-height:340px;object-fit:cover;display:block}.story-visual .overlay{position:absolute;inset:auto 14px 14px 14px;background:rgba(6,12,28,.78);backdrop-filter:blur(8px);border-radius:14px;padding:10px;color:#fff}
.story-player{border:1px solid var(--line);border-radius:22px;padding:16px;background:var(--card2);display:grid;align-content:start;gap:12px}.story-player audio{width:100%}.story-grammar{display:flex;gap:6px;flex-wrap:wrap}.story-grammar span{padding:5px 9px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12px}.story-scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.story-scene{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:10px}.story-scene.active{outline:2px solid var(--accent)}.story-transcript{direction:ltr;text-align:left;line-height:2;max-height:360px;overflow:auto;border-top:1px solid var(--line);padding-top:12px}.hidden{display:none!important}
.listen-grid{display:grid;gap:10px}.listen-card{border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--card2)}.listen-head{display:flex;align-items:center;gap:10px;direction:ltr;text-align:left}.listen-feedback{margin-top:8px}
.ref-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.ref-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:15px;text-decoration:none;color:var(--text)}.ref-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--soft);font-size:22px}.ref-card small{color:var(--muted)}.ref-arrow{font-size:22px;color:var(--accent)}
.vocab-hotspot{cursor:pointer;border-bottom:2px dotted var(--accent);border-radius:4px;padding:0 1px}.popup-back{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:1200;display:none;align-items:flex-end;justify-content:center;padding:12px}.popup-back.show{display:flex}.popup{width:min(100%,540px);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.4)}.popup-head{display:flex;gap:10px;align-items:center}.popup-word{font-size:1.5rem;font-weight:900;direction:ltr;margin-left:auto}.popup-ipa{direction:ltr;text-align:left;font-family:Arial,sans-serif;font-size:1.08rem;color:var(--accent)}.popup-meaning{line-height:1.9}.popup-play{margin-top:10px}.close{background:var(--soft);color:var(--text);border:1px solid var(--line)}
.table-wrap{overflow:auto;border-radius:16px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:var(--card2)}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:center}.en{direction:ltr}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0}
@media(max-width:780px){.story-top{grid-template-columns:1fr}.story-scenes{grid-template-columns:1fr 1fr}.ref-grid{grid-template-columns:1fr}.controls-top{grid-template-columns:1fr}.section-head{display:block}.wrap{padding:10px 10px 105px}.lesson{padding:15px}}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.homecard{display:block;background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:22px;padding:18px;text-decoration:none;color:var(--text);box-shadow:var(--shadow)}.homecard b{font-size:1.25rem}.homecard small{color:var(--muted);display:block;margin-top:4px}</style></head><body><div class="wrap"><header class="hero"><span class="eyebrow">English Grammar Path</span><h1>مسیر یک‌دست آموزش گرامر</h1><p>چهار درس اصلی و دو مرجع مشترک، با نام‌های ثابت و بدون شمارهٔ نسخه.</p></header><div class="homegrid"><a class="homecard" href="./to-be.html"><b>To Be</b><small>am / is / are</small></a><a class="homecard" href="./present-simple.html"><b>Present Simple</b><small>do / does</small></a><a class="homecard" href="./present-continuous.html"><b>Present Continuous</b><small>am / is / are + verb-ing</small></a><a class="homecard" href="./present-perfect.html"><b>Present Perfect</b><small>have / has + V3</small></a><a class="homecard" href="./verb-forms-v1-v2-v3.html"><b>Verb Forms</b><small>V1 / V2 / V3</small></a><a class="homecard" href="./grammar-exceptions-common-mistakes.html"><b>Grammar Exceptions</b><small>Common mistakes & exceptions</small></a></div></div></body></html>
