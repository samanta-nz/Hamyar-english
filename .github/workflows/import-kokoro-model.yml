name: Import Kokoro model to LFS

on:
  workflow_dispatch:

jobs:
  import-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Download and verify pinned model
        shell: bash
        run: |
          set -euo pipefail
          MODEL='app/src/main/assets/models/kokoro-v1.0.fp16.onnx'
          URL='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx'
          SHA='f3a290d384fbb27966d462905c71a46cef9e5fd00516b40df32a0b4afe77ac96'
          SIZE='163527961'
          mkdir -p "$(dirname "$MODEL")"
          rm -f "$MODEL"
          curl --fail --location --retry 4 --retry-all-errors -o "$MODEL" "$URL"
          test "$(stat -c%s "$MODEL")" = "$SIZE"
          echo "$SHA  $MODEL" | sha256sum -c -

      - name: Commit model through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git lfs track '*.onnx'
          git add .gitattributes app/src/main/assets/models/kokoro-v1.0.fp16.onnx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Model is already tracked; nothing to commit.'
            exit 0
          fi
          git commit -m 'chore: add pinned Kokoro FP16 model via Git LFS'
          git push origin HEAD:main
