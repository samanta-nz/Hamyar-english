name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout including Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure pinned Kokoro model exists
        shell: bash
        run: |
          set -euo pipefail
          MODEL='app/src/main/assets/models/kokoro-v1.0.fp16.onnx'
          URL='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.fp16.onnx'
          SHA='f3a290d384fbb27966d462905c71a46cef9e5fd00516b40df32a0b4afe77ac96'
          SIZE='163527961'
          mkdir -p "$(dirname "$MODEL")"
          if [ ! -f "$MODEL" ] || [ "$(stat -c%s "$MODEL")" != "$SIZE" ]; then
            rm -f "$MODEL"
            curl --fail --location --retry 4 --retry-all-errors -o "$MODEL" "$URL"
          fi
          test "$(stat -c%s "$MODEL")" = "$SIZE"
          echo "$SHA  $MODEL" | sha256sum -c -

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamyar-english-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
